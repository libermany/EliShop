<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>אלי_שופ</title>
<link rel="icon" href="assets/logo.jpg">
<style>
  :root {
    --bg: #f5f8fa;
    --card: #ffffff;
    --text: #1d2b36;
    --muted: #5d6f7d;
    --brand: #ff4f1f;
    --brand-dark: #d93d12;
    --teal: #0d8ea3;
    --border: #dbe4ea;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121a20;
      --card: #1b252d;
      --text: #e8eef2;
      --muted: #9fb1bd;
      --border: #2c3a44;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", Arial, "Noto Sans Hebrew", sans-serif;
    line-height: 1.6;
  }
  header {
    background: linear-gradient(135deg, var(--teal), #0a6a7a);
    color: #fff;
    padding: 32px 16px;
  }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 0 16px; }
  .brand { display: flex; align-items: center; gap: 20px; }
  .logo {
    width: 96px; height: 96px; border-radius: 50%;
    object-fit: cover; border: 3px solid #fff; flex: none;
  }
  h1 { margin: 0; font-size: 2rem; }
  .sub { margin: 4px 0 0; opacity: .9; }
  .search { margin-top: 24px; }
  .search input {
    width: 100%; padding: 14px 18px; font-size: 1rem;
    border: 0; border-radius: 10px; font-family: inherit;
  }
  main { padding: 32px 0 48px; }
  h2 { margin: 0 0 16px; font-size: 1.3rem; }
  .grid {
    display: grid; gap: 16px;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  }
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 20px;
  }
  .card h3 { margin: 0 0 8px; color: var(--brand); font-size: 1.1rem; }
  .card p { margin: 0 0 12px; color: var(--muted); font-size: .95rem; }
  .card ul { margin: 0; padding: 0 20px 0 0; }
  .card a { color: var(--teal); text-decoration: none; }
  .card a:hover { text-decoration: underline; }
  .hidden { display: none; }
  footer {
    border-top: 1px solid var(--border); padding: 20px 0;
    color: var(--muted); font-size: .9rem; text-align: center;
  }
  @media (max-width: 520px) {
    .logo { width: 72px; height: 72px; }
    h1 { font-size: 1.5rem; }
  }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="brand">
      <img class="logo" src="assets/logo.jpg" alt="לוגו אלי שופ">
      <div>
        <h1>אלי_שופ</h1>
        <p class="sub">פורטל בסיס ידע – Genesys Cloud CX בעברית</p>
      </div>
    </div>
  </div>
</header>

<main class="wrap">
  <div id="genesys-support-center"></div>
</main>

<footer>
  <div class="wrap">© אלי_שופ · בסיס ידע Genesys Cloud CX בעברית</div>
</footer>

<script type="text/javascript" charset="utf-8">
  (function (g, e, n, es, ys) {
    g['_genesysJs'] = e;
    g[e] = g[e] || function () {
      (g[e].q = g[e].q || []).push(arguments)
    };
    g[e].t = 1 * new Date();
    g[e].c = es;
    ys = document.createElement('script'); ys.async = 1; ys.src = n; ys.charset = 'utf-8'; document.head.appendChild(ys);
  })(window, 'Genesys', 'https://apps.euw2.pure.cloud/genesys-bootstrap/genesys.min.js', {
    environment: 'prod-euw2',
    deploymentId: '74e24148-c7e7-4d9c-9514-4fc6575bb7d8'
  });
</script>
</body>
</html>
